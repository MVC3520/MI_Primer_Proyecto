<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel de imágenes manual</title>
        <style>
    .carrusel { width: 300px; overflow: hidden; }
    .imagenes { display: flex; transition: transform 0.5s; }
    img { width: 300px; height: 200px; }
    </style>
</head>
<body>
    <div class="carrusel">
  <div class="imagenes">
    <img src="https://picsum.photos/300/200?1" alt="Imagen 1">
    <img src="https://picsum.photos/300/200?2" alt="Imagen 2">
    <img src="https://picsum.photos/300/200?3" alt="Imagen 3">
  </div>
  <button id="anterior">Anterior</button>
  <button id="siguiente">Siguiente</button>
  <p>Imagen <span id="indice">1</span> de 3</p>
    </div>

    <script>
        const imagenes = document.querySelector('.imagenes');
        const btnAnterior = document.getElementById('anterior');
        const btnSiguiente = document.getElementById('siguiente');
        const indicador = document.getElementById('indice');
        let indiceActual = 0;

        const totalImagenes = document.querySelectorAll('.imagenes img').length;
        const anchoImagen=300; // Ancho fijo de las imágenes
        function actualizarCarrusel() {
            imagenes.style.transform = `translateX(-${indiceActual * anchoImagen}px)`;
            indicador.textContent = indiceActual + 1;
        }
        btnSiguiente.addEventListener('click', () => {
            if(indiceActual < totalImagenes - 1) {
                indiceActual++;
                actualizarCarrusel();
            }
        });
        btnAnterior.addEventListener('click', () => {
            if(indiceActual > 0) {
                indiceActual--;
                actualizarCarrusel();
            }
        });

    </script>
</body>
</html>
