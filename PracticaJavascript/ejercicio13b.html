<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Atributos</title>
</head>
<body>
    <h3>Cambiar Atributos src y alt</h3>
    
    <img id="foto" src="" alt="Sin imagen" width="200" height="150" 
         style="border: 2px solid #ccc; padding: 10px; background: #f0f0f0;">
    
    <div style="margin-top: 15px;">
        <button onclick="mostrarImagen('sol', 'Un sol brillante')">☀️ Sol</button>
        <button onclick="mostrarImagen('luna', 'Una luna en la noche')">🌙 Luna</button>
        <button onclick="mostrarImagen('estrella', 'Una estrella brillante')">⭐ Estrella</button>
        <button onclick="limpiarImagen()">Limpiar</button>
    </div>
    
    <p id="info">Atributo alt: </p>
    
    <script>
        // Seleccionar elementos
        var foto = document.getElementById('foto');
        var info = document.getElementById('info');
        
        // Función para mostrar imagen
        function mostrarImagen(tipo, textoAlt) {
            // Crear URL de imagen emoji (no necesita internet)
            var emojis = {
                'sol': '☀️',
                'luna': '🌙', 
                'estrella': '⭐'
            };
            
            // Usar data URL para mostrar el emoji como imagen
            foto.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><text x="50" y="60" font-size="60" text-anchor="middle">' + emojis[tipo] + '</text></svg>';
            
            // Cambiar atributo alt
            foto.alt = textoAlt;
            
            // Mostrar información
            info.textContent = 'Atributo alt: ' + textoAlt;
            
            console.log('src cambiado');
            console.log('alt cambiado a: ' + textoAlt);
        }
        
        // Función para limpiar
        function limpiarImagen() {
            foto.src = '';
            foto.alt = 'Sin imagen';
            info.textContent = 'Atributo alt: ';
        }
        
        console.log('Para cambiar atributos: elemento.src y elemento.alt');
    </script>
</body>
</html>
