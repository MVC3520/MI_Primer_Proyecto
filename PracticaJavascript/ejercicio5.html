<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evitar Propagación de Eventos</title>
    <style>
        #contenedorExterno {
            padding: 30px;
            background-color: #e3f2fd;
            border: 3px solid #1976d2;
            border-radius: 10px;
            margin: 20px;
        }
        
        #contenedorInterno {
            padding: 30px;
            background-color: #fce4ec;
            border: 3px solid #c2185b;
            border-radius: 10px;
            margin: 20px;
        }
        
        #botonInterno {
            padding: 15px 30px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        
        #botonSinStop {
            padding: 15px 30px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        #consola {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 20px;
            font-family: monospace;
            min-height: 100px;
            border-radius: 5px;
        }
        
        .mensaje-contenedor {
            color: #1976d2;
            font-weight: bold;
        }
        
        .mensaje-boton {
            color: #c2185b;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Demostración de stopPropagation()</h1>
    
    <div id="contenedorExterno">
        <p>Contenedor Externo (Azul)</p>
        
        <div id="contenedorInterno">
            <p>Contenedor Interno (Rosa)</p>
            <button id="botonInterno">Botón con stopPropagation()</button>
            <button id="botonSinStop">Botón SIN stopPropagation()</button>
        </div>
    </div>
    
    <h3>Registro de Eventos:</h3>
    <div id="consola">
        <p>Los eventos aparecerán aquí...</p>
    </div>
    
    <script>
        // Seleccionar elementos
        const contenedorExterno = document.getElementById('contenedorExterno');
        const contenedorInterno = document.getElementById('contenedorInterno');
        const botonInterno = document.getElementById('botonInterno');
        const botonSinStop = document.getElementById('botonSinStop');
        const consola = document.getElementById('consola');

        // Función para agregar mensajes a la consola
        function agregarMensaje(texto, clase) {
            const mensaje = document.createElement('p');
            mensaje.textContent = `[${new Date().toLocaleTimeString()}] ${texto}`;
            mensaje.className = clase;
            consola.appendChild(mensaje);
            consola.scrollTop = consola.scrollHeight; // Auto-scroll
        }

        // Evento para el contenedor externo
        contenedorExterno.addEventListener('click', () => {
            agregarMensaje('Evento: Contenedor Externo clickeado', 'mensaje-contenedor');
        });

        // Evento para el contenedor interno
        contenedorInterno.addEventListener('click', () => {
            agregarMensaje('Evento: Contenedor Interno clickeado', 'mensaje-boton');
        });

        // Evento para el botón CON stopPropagation()
        botonInterno.addEventListener('click', (evento) => {
            // Detener la propagación del evento
            evento.stopPropagation();
            agregarMensaje('Evento: Botón Interno clickeado (con stopPropagation)', 'mensaje-boton');
            alert('Este botón usa stopPropagation(). El evento NO llegará a los contenedores.');
        });

        // Evento para el botón SIN stopPropagation()
        botonSinStop.addEventListener('click', () => {
            agregarMensaje('Evento: Botón SIN stopPropagation clickeado', 'mensaje-boton');
            alert('Este botón NO usa stopPropagation(). El evento SI llegará a los contenedores.');
        });

        // Limpiar consola cada 10 mensajes
        setInterval(() => {
            if (consola.children.length > 10) {
                consola.removeChild(consola.firstChild);
            }
        }, 1000);
    </script>
</body>
</html>
