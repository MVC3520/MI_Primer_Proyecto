<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        .acordeon {
            width: 400px;
            margin: 20px;
        }
        
        .titulo {
            background: #3498db;
            color: white;
            padding: 12px;
            margin: 0;
            cursor: pointer;
            border-bottom: 1px solid white;
        }
        
        .titulo:hover {
            background: #2980b9;
        }
        
        .contenido {
            background: #f9f9f9;
            padding: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s, padding 0.3s;
        }
        
        .mostrar {
            padding: 15px;
            max-height: 200px;
        }
        
        .activa {
            background: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="acordeon">
        <div class="seccion">
            <h3 class="titulo">Sección 1</h3>
            <div class="contenido">
                <p>Contenido de la sección 1.</p>
            </div>
        </div>
        
        <div class="seccion">
            <h3 class="titulo">Sección 2</h3>
            <div class="contenido">
                <p>Contenido de la sección 2.</p>
            </div>
        </div>
        
        <div class="seccion">
            <h3 class="titulo">Sección 3</h3>
            <div class="contenido">
                <p>Contenido de la sección 3.</p>
            </div>
        </div>
    </div>
    
    <script>
        var titulos = document.querySelectorAll('.titulo');
        var seccionAbierta = null;
        
        titulos.forEach(function(titulo) {
            titulo.addEventListener('click', function() {
                var contenido = this.nextElementSibling;
                
                // Cerrar sección anterior si existe
                if (seccionAbierta && seccionAbierta !== contenido) {
                    seccionAbierta.classList.remove('mostrar');
                    seccionAbierta.previousElementSibling.classList.remove('activa');
                }
                
                // Alternar la actual
                if (contenido.classList.contains('mostrar')) {
                    contenido.classList.remove('mostrar');
                    this.classList.remove('activa');
                    seccionAbierta = null;
                } else {
                    contenido.classList.add('mostrar');
                    this.classList.add('activa');
                    seccionAbierta = contenido;
                }
            });
        });
    </script>
</body>
</html>
