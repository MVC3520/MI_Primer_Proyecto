<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input a Párrafo</title>
</head>
<body>
    <h3>Escribe algo y haz clic en Mostrar</h3>
    
    <input type="text" id="entrada" placeholder="Tu texto aquí">
    <button onclick="mostrar()">Mostrar</button>
    
    <p id="salida" style="margin-top: 15px; padding: 10px; background: #f0f0f0;">
        Aquí verás tu texto
    </p>
    
    <script>
        // Función principal
        function mostrar() {
            // 1. Obtener elemento input
            var entrada = document.getElementById('entrada');
            
            // 2. Obtener su valor (texto escrito)
            var texto = entrada.value;
            
            // 3. Obtener elemento de salida
            var salida = document.getElementById('salida');
            
            // 4. Mostrar el texto en el párrafo
            salida.textContent = 'Escribiste: ' + texto;
        }
        
        console.log('Para obtener texto: document.getElementById("id").value');
    </script>
</body>
</html>
