<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evitar Propagación de Eventos</title>
    <style>
        #contenedorExterno {
            padding: 30px;
            background-color: #e3f2fd;
            border: 3px solid #1976d2;
            border-radius: 10px;
            margin: 20px;
        }
        
        #contenedorInterno {
            padding: 30px;
            background-color: #fce4ec;
            border: 3px solid #c2185b;
            border-radius: 10px;
            margin: 20px;
        }
        
        #botonInterno {
            padding: 15px 30px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        
        #botonSinStop {
            padding: 15px 30px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        #consola {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 20px;
            font-family: monospace;
            min-height: 100px;
            border-radius: 5px;
        }
        
        .mensaje-contenedor {
            color: #1976d2;
            font-weight: bold;
        }
        
        .mensaje-boton {
            color: #c2185b;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Demostración de stopPropagation()</h1>
    
    <div id="contenedorExterno">
        <p>Contenedor Externo (Azul)</p>
        
        <div id="contenedorInterno">
            <p>Contenedor Interno (Rosa)</p>
            <button id="botonInterno">Botón con stopPropagation()</button>
            <button id="botonSinStop">Botón SIN stopPropagation()</button>
        </div>
    </div>
    
    <h3>Registro de Eventos:</h3>
    <div id="consola">
        <p>Los eventos aparecerán aquí...</p>
    </div>
    
    <script>
        // 1. Seleccionar los elementos
        var contenedorExterno = document.getElementById('contenedorExterno');
        var contenedorInterno = document.getElementById('contenedorInterno');
        var botonInterno = document.getElementById('botonInterno');
        var botonSinStop = document.getElementById('botonSinStop');
        var consola = document.getElementById('consola');
        
        // 2. Función para mostrar mensajes
        function mostrarMensaje(texto) {
            var linea = document.createElement('p');
            linea.textContent = texto;
            consola.appendChild(linea);
        }
        
        // 3. Evento para el CONTENEDOR EXTERNO
        contenedorExterno.addEventListener('click', function() {
            mostrarMensaje('CLIC en Contenedor Externo (azul)');
        });
        
        // 4. Evento para el CONTENEDOR INTERNO
        contenedorInterno.addEventListener('click', function() {
            mostrarMensaje('CLIC en Contenedor Interno (rosa)');
        });
        
        // 5. Botón CON stopPropagation
        botonInterno.addEventListener('click', function(evento) {
            evento.stopPropagation(); // ¡DETIENE la propagación!
            mostrarMensaje('CLIC en Botón Verde (con stopPropagation)');
            alert('Este botón DETIENE la propagación. Solo ves este mensaje.');
        });
        
        // 6. Botón SIN stopPropagation
        botonSinStop.addEventListener('click', function() {
            mostrarMensaje('CLIC en Botón Naranja (sin stopPropagation)');
            alert('Este botón NO detiene la propagación. También verás los eventos de los contenedores.');
        });
        
        // 7. Mensaje inicial
        mostrarMensaje('Haz clic en los botones para ver la diferencia...');
    </script>
</body>
</html>
