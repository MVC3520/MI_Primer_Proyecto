<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla dinámica con JSON - Ejemplo didáctico</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        .contenedor {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .formulario {
            margin-top: 20px;
            padding: 15px;
            background: #e9e9e9;
            border-radius: 5px;
        }
        input, button {
            padding: 8px;
            margin: 5px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
<div class="contenedor">
    <h2>Tabla dinámica con JSON</h2>
    <p>Esta tabla se genera a partir de un <strong>array de objetos</strong> (simula una base de datos).</p>

    <!-- Aquí se dibujará la tabla -->
    <div id="tabla-container"></div>

    <!-- Formulario para agregar nuevas filas -->
    <div class="formulario">
        <h3>+ Agregar nuevo registro</h3>
        <input type="text" id="nombre" placeholder="Nombre" autocomplete="off">
        <input type="number" id="edad" placeholder="Edad">
        <input type="text" id="ciudad" placeholder="Ciudad">
        <button id="agregarBtn">Agregar</button>
        <div id="mensaje-error" class="error"></div>
    </div>
</div>

<script>
    // ========================
    // 1. DATOS EN FORMATO JSON (array de objetos)
    // ========================
    let datos = [
        { id: 1, nombre: "Ana García", edad: 25, ciudad: "Madrid" },
        { id: 2, nombre: "Luis Pérez", edad: 30, ciudad: "Barcelona" },
        { id: 3, nombre: "Carmen López", edad: 22, ciudad: "Valencia" }
    ];




    
    // Variable para llevar el próximo ID (para no repetir)
    let proximoId = 4;

    // ========================
    // 2. FUNCIÓN PARA RENDERIZAR LA TABLA
    // ========================
    function renderizarTabla() {
        // Obtener el contenedor donde pondremos la tabla
        const contenedor = document.getElementById("tabla-container");
        
        // Si ya hay una tabla, la reemplazamos (limpiar contenido)
        contenedor.innerHTML = "";
        
        // Crear la estructura de la tabla
        const tabla = document.createElement("table");
        
        // Cabecera (thead)
        const thead = document.createElement("thead");
        const filaCabecera = document.createElement("tr");
        // Definir los títulos de las columnas según las propiedades de los objetos
        const columnas = ["ID", "Nombre", "Edad", "Ciudad", "Acciones"];
        columnas.forEach(texto => {
            const th = document.createElement("th");
            th.textContent = texto;
            filaCabecera.appendChild(th);
        });
        thead.appendChild(filaCabecera);
        tabla.appendChild(thead);
        
        // Cuerpo (tbody)
        const tbody = document.createElement("tbody");
        
        // Recorremos el array 'datos' y por cada objeto creamos una fila
        datos.forEach(item => {
            const fila = document.createElement("tr");
            
            // Celda del ID
            const celdaId = document.createElement("td");
            celdaId.textContent = item.id;
            fila.appendChild(celdaId);
            
            // Celda del nombre
            const celdaNombre = document.createElement("td");
            celdaNombre.textContent = item.nombre;
            fila.appendChild(celdaNombre);
            
            // Celda de la edad
            const celdaEdad = document.createElement("td");
            celdaEdad.textContent = item.edad;
            fila.appendChild(celdaEdad);
            
            // Celda de la ciudad
            const celdaCiudad = document.createElement("td");
            celdaCiudad.textContent = item.ciudad;
            fila.appendChild(celdaCiudad);
            
            // Celda de acciones (botón eliminar)
            const celdaAccion = document.createElement("td");
            const btnEliminar = document.createElement("button");
            btnEliminar.textContent = "Eliminar";
            btnEliminar.style.backgroundColor = "#f44336";
            btnEliminar.style.margin = "0";
            // Al hacer clic en eliminar, borramos el registro
            btnEliminar.addEventListener("click", () => {
                eliminarRegistro(item.id);
            });
            celdaAccion.appendChild(btnEliminar);
            fila.appendChild(celdaAccion);
            
            tbody.appendChild(fila);
        });
        
        tabla.appendChild(tbody);
        contenedor.appendChild(tabla);
    }
    
    // ========================
    // 3. FUNCIÓN PARA ELIMINAR UN REGISTRO POR ID
    // ========================
    function eliminarRegistro(id) {
        // Filtramos el array, dejando solo los que NO tengan ese id
        datos = datos.filter(item => item.id !== id);
        // Volvemos a dibujar la tabla
        renderizarTabla();
    }
    
    // ========================
    // 4. FUNCIÓN PARA AGREGAR UN NUEVO REGISTRO
    // ========================
    function agregarRegistro() {
        // Obtener valores del formulario
        const nombreInput = document.getElementById("nombre");
        const edadInput = document.getElementById("edad");
        const ciudadInput = document.getElementById("ciudad");
        
        const nombre = nombreInput.value.trim();
        const edad = parseInt(edadInput.value);
        const ciudad = ciudadInput.value.trim();
        
        // Validaciones simples
        let errorMsg = "";
        if (nombre === "") errorMsg = "❌ El nombre es obligatorio.";
        else if (isNaN(edad) || edad <= 0) errorMsg = "❌ Edad inválida (debe ser número positivo).";
        else if (ciudad === "") errorMsg = "❌ La ciudad es obligatoria.";
        
        const mensajeErrorDiv = document.getElementById("mensaje-error");
        if (errorMsg) {
            mensajeErrorDiv.textContent = errorMsg;
            return;
        }
        
        // Limpiar mensaje de error
        mensajeErrorDiv.textContent = "";
        
        // Crear nuevo objeto
        const nuevoRegistro = {
            id: proximoId,
            nombre: nombre,
            edad: edad,
            ciudad: ciudad
        };
        
        // Agregar al array de datos
        datos.push(nuevoRegistro);
        proximoId++;  // incrementar para el siguiente
        
        // Limpiar campos del formulario
        nombreInput.value = "";
        edadInput.value = "";
        ciudadInput.value = "";
        
        // Actualizar la tabla
        renderizarTabla();
    }
    
    // ========================
    // 5. INICIALIZAR: mostrar tabla y conectar eventos
    // ========================
    renderizarTabla();
    
    // Asignar evento al botón "Agregar"
    const botonAgregar = document.getElementById("agregarBtn");
    botonAgregar.addEventListener("click", agregarRegistro);
    
    // Opcional: permitir agregar presionando "Enter" en cualquier campo
    const campos = ["nombre", "edad", "ciudad"];
    campos.forEach(id => {
        document.getElementById(id).addEventListener("keypress", (e) => {
            if (e.key === "Enter") agregarRegistro();
        });
    });
    
    // Pequeño mensaje en consola para explicar
    console.log(" Tabla dinámica generada a partir del JSON:", datos);
</script>
</body>
</html>
